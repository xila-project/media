[tools]
node = "24.22.0"
python = "3.13.18"
"conda:ffmpeg" = "7.1.1"

[tasks."deps:install"]
description = "Install exact npm dependencies and Chromium"
run = ["npm ci", "npx playwright install chromium", "python3 scripts/brand.py"]

[tasks.preview]
description = "Preview Motion Canvas projects"
run = "npm run preview"

[tasks."render:logo"]
run = "npm run render -- --production logo"

[tasks."render:trailer"]
run = "npm run render -- --production trailer"

[tasks."render:startup"]
run = ["python3 scripts/audio.py fixture output/startup/source-test.wav", "python3 scripts/audio.py process output/startup/source-test.wav"]

[tasks."blender:generate"]
tools = { "aqua:blender/blender" = "4.5.15" }
run = "blender --background --factory-startup --python-exit-code 1 --python blender/scripts/logo.py -- --generate-only"

[tasks."render:blender"]
tools = { "aqua:blender/blender" = "4.5.15" }
run = "blender --background --factory-startup --python-exit-code 1 --python blender/scripts/logo.py"

[tasks.check]
run = "npm run check"

[tasks.clean]
run = "npm run clean"

[tasks."render:cinematic-opening"]
description = "Render the cinematic opening study and assemble its review MP4"
tools = { "aqua:blender/blender" = "4.5.15" }
run = ["blender --background --factory-startup --python-exit-code 1 --python blender/scripts/cinematic_opening.py", "python3 scripts/video.py assemble output/cinematic-opening/frames output/cinematic-opening/opening-bootsplash.mp4 --preset fast", "python3 scripts/video.py validate output/cinematic-opening/opening-bootsplash.mp4 --width 960 --height 540 --fps 30 --duration 8"]

[tasks."render:product-reveal"]
description = "Render the modular cinematic product passage, using CUDA when available"
tools = { "aqua:blender/blender" = "4.5.15" }
run = "python3 scripts/render_product.py"

[tasks."render:architecture-reveal"]
description = "Render the kinetic architecture study with a brief native-session illustration"
tools = { "aqua:blender/blender" = "4.5.15" }
run = "python3 scripts/render_product.py --production architecture-reveal"

[tasks."render:final-reveal"]
run = "npm run render -- --production final-reveal"

[tasks."render:rust-core"]
run = "npm run render -- --production rust-core"

[tasks."render:wasm-execution"]
run = "npm run render -- --production wasm-execution"
